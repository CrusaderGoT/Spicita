[project]
name = "spicita"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-bootstrap5>=25.1",
    "djhtml>=3.0.7",
    "pillow>=11.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.0",
    "mypy>=1.19.1",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "spicita_project.settings"
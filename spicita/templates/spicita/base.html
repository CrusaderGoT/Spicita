<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spicita</title>
    {% load static %} {% load django_bootstrap5 %}
    {% bootstrap_css %} {% bootstrap_javascript %}

    {% block extratags %} {% endblock extratags %}
  </head>

  <body>
    <header>
      <div class="navbar shadow-sm">
        <div class="container-fluid">
          <a
            href="{% url 'home' %}"
            class="navbar-brand d-flex align-items-center"
          >
            <strong>Spicita</strong>
          </a>

          <div class="dropdown">
            <button
              class="btn dropdown-toggle btn-sm"
              type="button"
              aria-expanded="false"
              data-bs-toggle="dropdown"
              aria-label="Toggle theme (auto)"
            >
              Toggle theme
              <span class="visually-hidden" id="bd-theme-text"
              >Toggle theme</span
                >
              </button>

              <ul
                class="dropdown-menu dropdown-menu-end shadow"
                aria-labelledby="bd-theme-text"
              >
                <li>
                  <button
                    type="button"
                    class="dropdown-item d-flex align-items-center"
                    data-bs-theme-value="light"
                    aria-pressed="false"
                  >
                    Light
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="dropdown-item d-flex align-items-center"
                    data-bs-theme-value="dark"
                    aria-pressed="false"
                  >
                    Dark
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="dropdown-item d-flex align-items-center active"
                    data-bs-theme-value="auto"
                    aria-pressed="true"
                  >
                    Auto
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </header>

      <main class="container p-4">
        {% block content %} {% endblock content %}
      </main>


      <footer class="text-body-secondary container-fluid">
        <hr />

        <p class="float-end m-1">
          <a href="#">&uArr; Back to top</a>
        </p>

        <div class="p-2">
          <h4 class="text-md-center">Contact</h4>
          <ul class="list-unstyled d-flex flex-column flex-md-row  justify-content-evenly">
            <li><a href="#" class="text-white">Twitter</a></li>
            <li><a href="#" class="text-white">Facebook</a></li>
            <li><a href="#" class="text-white">Email</a></li>
          </ul>
        </div>

        <div>


          <p class="mb-3">
            &copy; Spicita, taste to spice you up!
          </p>

        </div>

      </footer>

      <script src="{% static '/js/modeToggle.js' %}"></script>
    </body>
  </html>
